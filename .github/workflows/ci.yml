name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, new-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm lint --format=github
      - run: pnpm format --check
      - run: pnpm knip
      - run: pnpm typecheck --affected
      - run: |
          sandbox_helper="$(find "$GITHUB_WORKSPACE/.cache/mf-dashboard-chromium" -type f -name chrome_sandbox -print -quit)"
          test -n "$sandbox_helper"
          sudo install -D -o root -g root -m 4755 "$sandbox_helper" /usr/local/lib/mf-dashboard-chromium/chrome_sandbox
          echo "CHROME_DEVEL_SANDBOX=/usr/local/lib/mf-dashboard-chromium/chrome_sandbox" >> "$GITHUB_ENV"
      - run: pnpm test --affected
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm build:demo --affected
      - run: pnpm --filter @mf-dashboard/db build:demo
      - run: pnpm --filter @mf-dashboard/db test:demo
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCESS_AUD: ci-access-audience
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ci.cloudflareaccess.com
      DASHBOARD_URL: https://dashboard.example.com
      REFRESH_TOKEN: ci-refresh-token
    strategy:
      fail-fast: false
      matrix:
        app: [crawler, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cp .env.example .env
      - run: docker compose build ${{ matrix.app }}
  build-e2e-web:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: DEMO_MODE=false pnpm --filter @mf-dashboard/web build
      - run: |
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          tar -czf e2e-web-build.tar.gz -C apps/web/.next/standalone .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-web-build
          path: e2e-web-build.tar.gz
          retention-days: 1
  e2e-web:
    needs: build-e2e-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-web-build
          path: .artifacts
      - run: |
          mkdir -p apps/web/.next/standalone
          tar -xzf .artifacts/e2e-web-build.tar.gz -C apps/web/.next/standalone
      - run: |
          sandbox_helper="$(find "$GITHUB_WORKSPACE/.cache/mf-dashboard-chromium" -type f -name chrome_sandbox -print -quit)"
          test -n "$sandbox_helper"
          install -D -o root -g root -m 4755 "$sandbox_helper" /usr/local/lib/mf-dashboard-chromium/chrome_sandbox
          echo "CHROME_DEVEL_SANDBOX=/usr/local/lib/mf-dashboard-chromium/chrome_sandbox" >> "$GITHUB_ENV"
      - run: chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
      - run: |
          su --preserve-environment --shell /bin/bash pwuser -c '
            export HOME=/home/pwuser
            export PATH="/pnpm:$PATH"
            cd "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            pnpm test:e2e:web -- --shard=${{ matrix.shard }}
          '
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-blob-report-${{ strategy.job-index }}
          path: apps/web/blob-report/
          retention-days: 7

  merge-e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8.0.2
        with:
          path: all-blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true
      - run: pnpm --filter @mf-dashboard/web exec playwright merge-reports --reporter html ../../all-blob-reports
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
